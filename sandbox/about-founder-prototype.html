se; } .practice-section { padding:clamp(76px,11vw,150px) 0; background:#e7e5dd; } .practice-section h2 { max-width:13ch; margin:0; font-size:clamp(42px,6vw,78px); line-height:.9; letter-spacing:-.055em; } .practice-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin-top:48px; background:var(--ink); } .practice-grid article { min-height:230px; padding:28px; background:var(--paper); } .practice-grid h3 { margin:52px 0 10px; font:700 30px/1 "Source Serif 4",Georgia,serif; letter-spacing:-.035em; } .practice-grid p { margin:0; color:var(--muted); } .programme-cta { padding:clamp(72px,10vw,125px) 0; background:var(--brass); } .programme-cta h2 { max-width:14ch; margin:0 0 28px; font-size:clamp(42px,6vw,78px); line-height:.9; letter-spacing:-.055em; }
    @media (max-width:760px) { .site-nav { min-height:62px; } .nav-links { display:none; } .shell { width:min(100% - 32px,1248px); } .editorial-hero { grid-template-columns:1fr; } .editorial-copy { min-height:66svh; } .editorial-photo { min-height:360px; } .editorial-hero.selected .editorial-copy { width:auto; min-height:66svh; } .editorial-hero.selected .editorial-photo { min-height:440px; } .letter-section,.record-head,.about-purpose,.proof-head,.founder-showcase-head,.curriculum-section .split,.gavin-mission { grid-template-columns:1fr; } .trio,.practice-grid,.founder-showcase-grid { grid-template-columns:1fr; } .voice { grid-template-columns:64px 1fr; gap:16px; } .voice .role { grid-column:2; } .voice img { width:58px; } .record-hero .lede { margin-left:0; } .record-row { grid-template-columns:38px 1fr; gap:14px; } .record-row p,.record-row img { grid-column:2; } .stat-line { grid-template-columns:1fr 1fr; } .stat-line div:nth-child(2) { border-right:0; } .stat-line div:nth-child(-n+2) { border-bottom:1px solid rgba(255,255,255,.17); } .proof-grid { grid-template-columns:1fr; } }
    .proto-picker {

<body>
  <main id="stage" aria-live="polite"></main>

  <script>
    const navigation = `<header class="site-nav"><a class="brand" href="../pages/about.html">DebateCraft</a><nav class="nav-links" aria-label="Preview navigation"><a href="../pages/about.html">About</a><a href="../pages/team.html">Team</a><a href="../pages/offerings.html">Programmes</a></nav></header><span class="sandbox-note">Founder page sandbox · original unchanged</span>`;
    const footer = `<footer class="footer">DebateCraft · Founder page design study</footer>`;
    const fullAbout = `<section class="about-extension"><section class="shell about-purpose"><div><p class="eyebrow">What we do</p><h2>Build strong junior teams.</h2></div><div class="copy"><p>DebateCraft provides schools with structured debate curriculum, formative feedback, and competition preparation.</p><p>We start with the junior bench: analysis, case construction, rebuttal, delivery, and disciplined round review. Students then progress into WSDC and BP.</p><p>Our team brings experience from Hong Kong, Asian, and global circuits. The curriculum records learning outcomes, assessment evidence, and handover requirements.</p></div></section><section class="global-band"><div class="shell"><p class="eyebrow">Global classroom</p><h2>Students join from <em>19 countries.</em></h2><p>DebateCraft is student-run and nonprofit, bringing structured teaching to an international community of young debaters.</p><div class="stat-line"><div><strong>19</strong><span>Countries</span></div><div><strong>400+</strong><span>Students</span></div><div><strong>450+</strong><span>Hours taught</span></div><div><strong>Student-run</strong><span>Nonprofit</span></div></div></div></section><section class="shell proof-section"><div class="proof-head"><div><p class="eyebrow">Training in action</p><h2>From instruction to round review.</h2></div><p>Live online cohorts connect direct instruction, timed practice, class materials, and feedback.</p></div><div class="proof-grid"><figure><img src="../Images/Image2.jpeg" alt="Small-group DebateCraft class session" loading="lazy"><figcaption>Small-group debate session</figcaption></figure><figure><img src="../Images/Image5.png" alt="Live DebateCraft lesson discussion" loading="lazy"><figcaption>Live lesson discussion</figcaption></figure></div></section><section class="practice-section"><div class="shell"><p class="eyebrow">What students practise</p><h2>Reasoning, speaking, and round review.</h2><div class="practice-grid"><article><p class="founder-label">01</p><h3>Debate & communication</h3><p>Students practise clear reasoning, careful listening, and persuasive communication.</p></article><article><p class="founder-label">02</p><h3>Hong Kong leadership & Team HK</h3><p>Adviser Sandeep Chulani was Coach and Selector of Team HK and formerly chaired Hong Kong Schools Debating and Public Speaking Community. The team also includes Hong Kong WSDC Development Team members.</p></article><article><p class="founder-label">03</p><h3>Science & ethics</h3><p>Bioethics connects scientific questions with ethical reflection.</p></article></div></div></section><section class="programme-cta"><div class="shell"><p class="eyebrow">Explore DebateCraft</p><h2>Find a programme that fits.</h2><a class="button" href="../pages/offerings.html">Explore programmes</a></div></section></section>`;
    const profiles = {
      adrian: "<img src=\"../Images/Adrian.jpg\" alt=\"Adrian Chan\">",
      gavin: "<img src=\"../Images/Gavin.png\" alt=\"Gavin Zhao\">",
      sandeep: "<img src=\"../Images/Sandeep.png\" alt=\"Sandeep Chulani\">"
    };
    const variants = [
      () => `${navigation}<section class="editorial-hero selected"><div class="editorial-copy"><p class="eyebrow">Our founding story</p><h1>Debate begins with a reason to care.</h1><p class="lede">DebateCraft was created by Adrian Chan, Gavin Zhao, and Sandeep Chulani to make rigorous debate teaching more accessible, structured, and connected to real student growth.</p><a class="button" href="#founders">Meet the founders</a></div><div class="editorial-photo">${profiles.adrian}<p class="caption">Adrian Chan · Curriculum architect</p></div></section><section id="founders" class="shell founder-showcase"><div class="founder-showcase-head"><div><p class="eyebrow">Created together</p><h2>Three founders. One programme.</h2></div><p>Equal portraits show the partnership. The work beneath them makes clear who led each part of DebateCraft.</p></div><div class="founder-showcase-grid"><article class="founder-showcase-card"><img src="../Images/Adrian.jpg" alt="Adrian Chan"><div class="card-copy"><p class="founder-label">Curriculum architect</p><h3>Adrian Chan</h3><p>Created DebateCraft’s curriculum and led its academic direction, shaping how students build arguments, practise, and improve.</p></div></article><article class="founder-showcase-card"><img src="../Images/Gavin.png" alt="Gavin Zhao"><div class="card-copy"><p class="founder-label">Moral mission & care</p><h3>Gavin Zhao</h3><p>Anchors DebateCraft in care for students: how teaching feels, who it reaches, and the responsibility behind each programme.</p></div></article><article class="founder-showcase-card"><img src="../Images/Sandeep.png" alt="Sandeep Chulani"><div class="card-copy"><p class="founder-label">Coaching guidance</p><h3>Sandeep Chulani</h3><p>Brings long-standing debate, coaching, judging, and Hong Kong leadership experience to the organisation.</p></div></article></div></section><section class="curriculum-section"><div class="shell split"><div><p class="eyebrow">Adrian’s work</p><h2>The curriculum came <em>first.</em></h2></div><div class="copy"><p>Adrian built the curriculum that turns debate from an intimidating activity into a deliberate learning process: analyse a motion, build a case, test it in a round, receive feedback, and return stronger.</p><p>That academic structure is the foundation of DebateCraft. It shapes the lessons, the feedback students receive, and the path from a first speech to serious competition preparation.</p><p class="draft">Founder copy draft — refine with Adrian’s exact account of curriculum development before publication.</p></div></div></section><section class="shell gavin-mission"><div><p class="eyebrow">Gavin’s moral mission</p><h2>Care belongs in rigorous teaching.</h2></div><div class="copy"><p>Gavin’s contribution is a moral one: DebateCraft should treat students as people before competitors. High standards matter, but so do patience, access, dignity, and a programme that gives students room to grow.</p><p>That principle guides how DebateCraft communicates, builds community, and reaches students through its operations and Chinese-language outreach.</p><p class="draft">Founder copy draft — confirm Gavin’s own wording before publication.</p></div></section>${fullAbout}${footer}`,
      () => `${navigation}<section class="dialogue-hero"><div class="shell"><p class="eyebrow">The people behind DebateCraft</p><h1>Three perspectives. One shared standard.</h1><p>A founder page built as a conversation: who each person is, what they bring, and how that shapes the programmes students experience.</p></div></section><section class="founder-conversation"><div class="shell"><article class="voice">${profiles.adrian}<div><h2>Adrian Chan</h2><p>Sets a learning standard built on careful reasoning, useful feedback, and visible improvement for every student.</p></div><span class="role">Teaching vision</span></article><article class="voice">${profiles.gavin}<div><h2>Gavin Zhao</h2><p>Connects DebateCraft’s day-to-day operation with its digital work and Chinese-language outreach.</p></div><span class="role">Operations & outreach</span></article><article class="voice">${profiles.sandeep}<div><h2>Sandeep Chulani</h2><p>Contributes deep coaching and adjudication experience, including past Team HK leadership and HKBPDC co-founding.</p></div><span class="role">Coaching guidance</span></article></div></section><section class="shell dialogue-note"><p class="eyebrow">Adrian’s note</p><p class="quote">“We wanted students to leave each session with a clearer argument, a more useful question, and a next step they could act on.”<cite>Draft founder commentary — Adrian approval required</cite></p><p class="draft">Use this format for one approved first-person statement. It gives Adrian a central voice without turning the page into a timeline or a series of reflection inserts.</p></section>${fullAbout}${footer}`,
      () => `${navigation}<section class="record-hero"><div class="shell"><p class="eyebrow">About DebateCraft</p><h1>A school of argument, built by practitioners.</h1><p class="lede">This direction presents the founders through the work they bring to DebateCraft: programme design, operations, coaching, and adjudication.</p></div></section><section class="shell founder-record"><div class="record-head"><h2>Founders’ record.</h2><p>Formal, evidence-led, and concise. Best when DebateCraft needs to read first as an institution, while giving the founding team clear authority.</p></div><article class="record-row"><span class="number">01</span>${profiles.adrian}<h3>Adrian Chan</h3><p>International debate experience, adjudication, and a student-facing focus on measurable improvement.</p></article><article class="record-row"><span class="number">02</span>${profiles.gavin}<h3>Gavin Zhao</h3><p>Public Forum experience alongside operations, web development, and Chinese-language outreach.</p></article><article class="record-row"><span class="number">03</span>${profiles.sandeep}<h3>Sandeep Chulani</h3><p>More than two decades of debate, coaching, and judging experience; former Team HK Coach and Selector; HKBPDC co-founder.</p></article><section class="founder-statement"><p class="eyebrow">Adrian’s commentary</p><p class="quote">“DebateCraft should help students do more than compete well. It should teach them how to think carefully, listen seriously, and improve with purpose.”</p><p class="draft">Draft founder commentary — confirm wording with Adrian before publishing.</p></section></section>${fullAbout}${footer}`
    ];

    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
